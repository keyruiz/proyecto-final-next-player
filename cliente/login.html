<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexxt - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <main div class="logo">
            <a href="/">
                <img src="img/nextPlayerLogo.png" alt="Nexxt Logo" class="logo-img">
            </a>
        </main>
        <nav class="nav-links">
            <a href="#">REGISTER</a>
            <a href="#" class="active">LOG IN</a>
        </nav>
    </header>

    <main class="content">
        <section class="login-box">
            <h1>Iniciar sesión</h1>
            
            <form id="loginForm">
                <section class="input-field">
                    <label for="user">Usuario/Correo</label>
                    <input type="text" id="user" name="user" required>
                </section>

                <section class="input-field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </section>

                <section class="options">
                    <input type="checkbox" id="remember">
                    <label for="remember">Recuérdame</label>
                </section>

                <section class="social-icons">
                    <div class="icon-card"><img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google"></div>
                    <div class="icon-card dark"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968814.png" alt="Steam"></div>
                    <div class="icon-card"><img src="https://cdn-icons-png.flaticon.com/512/8002/8002150.png" alt="Riot"></div>
                </section>

                <button type="submit" class="login-btn">Iniciar sesión</button>
            </form>
        </section>
    </main>

    <script/>
</body>
</html>
